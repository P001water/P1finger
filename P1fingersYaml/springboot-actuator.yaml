- id: springboot-actuator
  name: Detect Springboot Actuators
  author: nuclei
  tags:
  - springboot
  - actuator
  description: Detect Springboot Actuators
  paths:
  - /actuator
  - /actuator%72
  - /favicon.ico
  - /actuator/favicon.ico
  matchers:
  - location: body
